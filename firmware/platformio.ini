[env:yd_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
; Conservative 2 MB layout on the purchased 4 MB board; confirm board wiring.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I../include
lib_deps = adafruit/Adafruit VL53L1X@3.1.2
monitor_speed = 115200
