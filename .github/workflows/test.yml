name: Build and test C++ FreeRTOS starter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build C++ app and FreeRTOS kernel
        run: cmake --build build --parallel 2
      - name: Test controller and real RTOS task pipeline
        run: ctest --test-dir build --output-on-failure
  rp2040:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned firmware build tool
        run: python -m pip install platformio==6.1.18
      - name: Compile RP2040 motor and ToF firmware
        run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: rp2040-firmware
          path: |
            firmware/.pio/build/yd_rp2040/firmware.uf2
            firmware/.pio/build/yd_rp2040/firmware.elf
